# Render Blueprint: one free web service that builds the web app and serves it from the API.
# render.com → New → Blueprint → pick this repo. Render asks for the values marked sync: false.
services:
  - type: web
    name: tabilens
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TABILENS_MODE
        value: mock
      # Browser key for the map and destination photo. Vite bakes it in at build time,
      # so redeploy after changing it. Allow https://<your-app>.onrender.com/* on the key.
      - key: VITE_GOOGLE_MAPS_API_KEY
        sync: false
